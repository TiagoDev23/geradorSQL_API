services:
  postgres-platform:
    image: postgres:17-alpine
    container_name: gerador-api-platform-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_PLATFORM_DB}
      POSTGRES_USER: ${POSTGRES_PLATFORM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres_platform_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_PLATFORM_USER} -d ${POSTGRES_PLATFORM_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-demo:
    image: postgres:17-alpine
    container_name: gerador-api-demo-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DEMO_DB}
      POSTGRES_USER: ${POSTGRES_DEMO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DEMO_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - postgres_demo_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_DEMO_USER} -d ${POSTGRES_DEMO_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: gerador-api-backend
    restart: unless-stopped

    # Os segredos da aplicacao continuam morando em apps/api/.env, que
    # ja e o arquivo documentado para eles; nada e duplicado aqui. O
    # bloco `environment` abaixo tem precedencia e ajusta apenas o que
    # muda dentro da rede do compose.
    env_file:
      - path: ./apps/api/.env
        required: false

    environment:
      PORT: 3001

      # Dentro da rede do compose o banco interno atende pelo nome do
      # servico e pela porta do container, nao por localhost:5434.
      DATABASE_URL: postgresql://${POSTGRES_PLATFORM_USER}:${POSTGRES_PLATFORM_PASSWORD}@postgres-platform:5432/${POSTGRES_PLATFORM_DB}?schema=public

      # Origem do painel no navegador do host.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

    ports:
      - "3001:3001"

    depends_on:
      postgres-platform:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Embutido no bundle: precisa ser o endereco alcancavel pelo
        # navegador, e nao o nome do servico da rede interna.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}

    container_name: gerador-api-web
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - api

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  postgres_platform_data:
  postgres_demo_data: